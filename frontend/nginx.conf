server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service worker / manifest must never be cached long-term, or updates
  # to the app won't be picked up by clients holding an old cached sw.js.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build assets are safe to cache aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # nginx's stock mime.types has no entry for .mjs (an ESM-specific
  # extension), so it falls back to application/octet-stream — browsers
  # refuse to load that as a module (pdfjs-dist's worker script hits this).
  # default_type only fills in when nginx can't otherwise determine the
  # type, so it doesn't disturb the existing mime.types map for everything
  # else already working (.js, .css, etc).
  location ~* \.mjs$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/javascript;
    try_files $uri =404;
  }

  # Proxy API calls to the backend container over the compose-internal
  # network — Deploro's VPS deploy exposes exactly one public HTTP port per
  # project (see PRODUCT_PLAN.md), so the backend has no public port of its
  # own.
  #
  # The upstream host goes through a variable deliberately. With a literal
  # `proxy_pass http://backend:3001/`, nginx resolves `backend` once at
  # startup and caches that address for the life of the process — so any
  # deploy that recreates the backend container without also recreating
  # this one leaves nginx proxying to a container IP that no longer exists,
  # and every /api/ request 502s until the frontend happens to restart.
  # A variable upstream forces re-resolution against Docker's embedded DNS
  # instead. `rewrite ... break` replaces the prefix-stripping that a
  # trailing slash on proxy_pass provides, since that form is unavailable
  # once the target is a variable: /api/documents -> /documents.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_host:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
  }

  # Client-side routing (react-router BrowserRouter) — fall back to
  # index.html for any path that isn't a real static file, so a hard
  # refresh on /reader/:id doesn't 404.
  location / {
    try_files $uri /index.html;
  }
}
