# Deploy stack for `deploro vps deploy`. Builds and runs the actual app:
# the Express API and the built static PWA behind nginx, as two services in
# the VPS compute stack.
#
# Deploro's shared VPS already owns host ports 80/443 itself (its own nginx
# provides the https://<slug>.deploro.app routing across every project on
# the box) — a project's own compose file must bind its web port to
# 127.0.0.1 on a distinct high port, never 0.0.0.0:80, or `docker compose
# up` fails with "address already in use" (confirmed by inspecting another
# project's working deploy: 127.0.0.1:8080->8080/tcp). `frontend` is the
# only service with a published port; its nginx config (frontend/nginx.conf)
# proxies `/api/*` to `backend` over the compose-internal network. That's
# also why VITE_API_BASE_URL is the fixed relative path `/api` rather than
# an absolute URL: the frontend never needs to know the deployment's public
# domain, in dev or in prod.
#
# Env vars come from Deploro's per-project VPS env (`deploro vps set-env`).
# Listed explicitly per-key below (${VAR} interpolation from the .env
# Deploro writes alongside this file) rather than `env_file: .env` — the
# latter failed on the VPS runner with a path-not-found error even though
# the same vars were set. See PRODUCT_PLAN.md for the full list required.

services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DEPLORO_API_URL: ${DEPLORO_API_URL}
      DEPLORO_API_TOKEN: ${DEPLORO_API_TOKEN}
      TTS_PROVIDER: ${TTS_PROVIDER}
      KOKORO_BASE_URL: ${KOKORO_BASE_URL}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR}
    volumes:
      # Local-disk storage fallback (used while S3_* is unset) needs to
      # survive redeploys/rebuilds — without this, every `vps deploy`
      # silently wipes every previously uploaded document and generated
      # audio file, since the container filesystem is otherwise ephemeral.
      - verbis-storage:/app/storage
    restart: unless-stopped

  # Self-hosted Kokoro-82M TTS (Apache 2.0), reachable only over the
  # compose-internal network at http://kokoro:8880 — no published port, same
  # as `backend`.
  #
  # PARKED behind a compose profile: defined here, but deliberately NOT
  # started by a normal `deploro vps deploy`. It came up healthy and stayed
  # healthy idle (~1.1GB resident, 68 voice packs, model warmed in 8.4s), and
  # /v1/audio/voices served fine — but every synthesis request killed it.
  # No access-log line, no traceback, socket closed with 0 bytes read, and
  # the container back at a fresh startup banner.
  #
  # The 4g limit was never the binding constraint — upstream measures ~1.15GB
  # resident after serving a request. What this shared box could not absorb
  # was the transient spike during inference, on top of every other project
  # already resident on it. cpus/mem_limit stay as neighbour protection for
  # whenever this runs again.
  #
  # Re-enable with `docker compose --profile kokoro up`, or by deleting the
  # profiles key, once this project has a host with real memory headroom.
  # Nothing on the app side needs to change: TTS_PROVIDER selects the
  # backend, and services/kokoro.ts is already verified against the real
  # /v1/audio/voices response.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles:
      - kokoro
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    expose:
      - "8880"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:18080:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  verbis-storage:
