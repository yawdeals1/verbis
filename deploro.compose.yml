# Deploy stack for `deploro vps deploy`. Builds and runs the actual app:
# the Express API and the built static PWA behind nginx, as two services in
# the VPS compute stack.
#
# Deploro's VPS deploy exposes exactly one public HTTP port per project
# (see PRODUCT_PLAN.md) — so `frontend` is the only service with a
# published port, and its nginx config (frontend/nginx.conf) proxies
# `/api/*` to `backend` over the compose-internal network. That's also why
# VITE_API_BASE_URL is the fixed relative path `/api` rather than an
# absolute URL: the frontend never needs to know the deployment's public
# domain, in dev or in prod.
#
# Env vars come from Deploro's per-project VPS env (`deploro vps set-env`),
# written into a `.env` file alongside this compose file on deploy — see
# PRODUCT_PLAN.md for the full list required.

services:
  backend:
    build:
      context: ./backend
    env_file: .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
